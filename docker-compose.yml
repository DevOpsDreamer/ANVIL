version: '3.8'

services:
  aegis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SQLITE_DB_PATH=/app/data/aegis.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - aegis_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # Required to spawn sandbox containers
    depends_on:
      - aegis-sandbox-image
    restart: unless-stopped

  aegis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - aegis-backend
    restart: unless-stopped

  # Dummy service to build the sandbox image, so the backend can use it
  aegis-sandbox-image:
    build:
      context: ./backend/docker
      dockerfile: Dockerfile.sandbox
    image: aegis-sandbox:latest
    command: ["echo", "Sandbox image built"]

volumes:
  aegis_data:
