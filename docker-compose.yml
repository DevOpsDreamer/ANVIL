version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite:///./anvil.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis

  target_app:
    build:
      context: ./target_app
    ports:
      - "5000:5000"
